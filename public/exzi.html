<!doctype html>
<!-- ============================================================
     EXZELLENT — Exzi Playground
     A full-page conversation with Exzi: text + voice, multi-turn memory,
     spoken replies, and an animated presence. Talks to /api/ai/chat.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Exzi Playground — EXZELLENT</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/logo.png">
<meta property="og:title" content="Exzi — your AI companion | Exzellent">
<meta property="og:description" content="Ask Exzi anything about learning German, studying in Germany or your career. Free to try, no signup needed.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://res.cloudinary.com/dsgxyezcm/image/upload/v1773748661/Exzellent-Black_txkmpd.png">
<meta name="description" content="Chat with Exzi, the EXZELLENT AI companion — by text or voice, with memory of your conversation."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060b; --bg2:#0a0c14; --surface:#0f1220; --line:rgba(148,163,215,.14);
  --text:#eef1fb; --muted:#9aa3c2;
  --p:#06B6D4; --pL:#67e8f9; --pRGB:6,182,212; --violetL:#a78bfa;
  --grad:linear-gradient(100deg,var(--pL),var(--violetL));
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:
    radial-gradient(1000px 500px at 82% -8%,rgba(var(--pRGB),.12),transparent 60%),
    radial-gradient(800px 460px at 0% 0%,rgba(138,75,245,.10),transparent 55%),
    var(--bg);
  color:var(--text);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;letter-spacing:-.02em}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);
  background:rgba(5,6,11,.7);backdrop-filter:blur(14px);flex:none}
.brand{display:flex;align-items:center;gap:12px}
.orb{width:38px;height:38px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--pL),var(--p) 55%,#4f2ea8 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 8px 28px rgba(var(--pRGB),.5);
  animation:breathe 3.6s var(--ease) infinite}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid rgba(var(--pRGB),.35);opacity:0;transition:opacity .3s}
body[data-mood="thinking"] .orb{animation-duration:1.1s}
body[data-mood="speaking"] .orb::after{opacity:1;animation:ring 1s var(--ease) infinite}
@keyframes breathe{50%{transform:scale(1.08);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 10px 40px rgba(var(--pRGB),.75)}}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.brand b{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.brand .st{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.hdr-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
  transition:color .25s,border-color .25s,background .25s}
.icon-btn:hover{color:var(--text);border-color:rgba(var(--pRGB),.5);background:rgba(var(--pRGB),.08)}
.icon-btn.on{color:#05121a;background:var(--pL);border-color:var(--pL)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--muted);
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);transition:.25s}
.back:hover{color:var(--text);border-color:rgba(var(--pRGB),.5);transform:translateX(-2px)}

/* thread */
.thread{flex:1;overflow-y:auto;padding:26px clamp(16px,4vw,40px);scroll-behavior:smooth}
.thread-in{width:min(820px,100%);margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;max-width:100%}
.msg .av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1rem}
.msg.exzi .av{background:radial-gradient(circle at 35% 30%,var(--pL),var(--p) 60%,#4f2ea8);box-shadow:0 4px 14px rgba(var(--pRGB),.4)}
.msg.me{flex-direction:row-reverse}
.msg.me .av{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.bubble{padding:12px 16px;border-radius:16px;font-size:.96rem;white-space:pre-wrap;word-wrap:break-word;max-width:min(80%,620px)}
.msg.exzi .bubble{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-top-left-radius:5px}
.msg.me .bubble{background:linear-gradient(120deg,rgba(var(--pRGB),.9),rgba(138,75,245,.85));color:#05121a;font-weight:500;border-top-right-radius:5px}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pL);opacity:.5;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1;transform:translateY(-3px)}}

/* welcome */
.welcome{text-align:center;padding:40px 0 8px}
.welcome .big-orb{width:84px;height:84px;margin:0 auto 20px}
.welcome h1{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:8px}
.welcome h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);max-width:46ch;margin:0 auto 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{font-size:.85rem;font-weight:500;color:var(--text);padding:9px 15px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);transition:.25s}
.chip:hover{border-color:rgba(var(--pRGB),.55);background:rgba(var(--pRGB),.1);transform:translateY(-2px)}

/* composer */
.composer{flex:none;padding:14px clamp(16px,4vw,40px) 22px;border-top:1px solid var(--line);background:rgba(5,6,11,.6);backdrop-filter:blur(12px)}
.composer-in{width:min(820px,100%);margin-inline:auto;display:flex;align-items:flex-end;gap:10px;
  border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px;background:rgba(255,255,255,.03);
  transition:border-color .25s,box-shadow .25s}
.composer-in:focus-within{border-color:rgba(var(--pRGB),.6);box-shadow:0 0 0 3px rgba(var(--pRGB),.14)}
#ta{flex:1;background:none;border:0;resize:none;color:var(--text);font-size:.98rem;line-height:1.5;
  max-height:140px;padding:8px 0;outline:none}
#ta::placeholder{color:rgba(154,163,194,.7)}
.send,.mic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;transition:.25s}
.send{background:var(--grad);color:#05121a;box-shadow:0 6px 20px rgba(var(--pRGB),.35)}
.send:hover{transform:translateY(-1px)}
.send:disabled{opacity:.5;box-shadow:none;transform:none;cursor:not-allowed}
.mic{border:1px solid var(--line);color:var(--muted)}
.mic:hover{color:var(--text);border-color:rgba(var(--pRGB),.5)}
.mic.rec{color:#05121a;background:#fb7185;border-color:#fb7185;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(251,113,133,.25)}}
.hint{width:min(820px,100%);margin:8px auto 0;font-size:.72rem;color:var(--muted);text-align:center}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:560px){ .welcome{padding-top:20px} .bubble{max-width:82%} }
body.embed .back{display:none}   /* opened as a popup — parent has its own close button */
body.embed .hdr{padding-right:66px}  /* keep header buttons clear of the popup's ✕ */
</style>
</head>
<body data-mood="idle">

<header class="hdr">
  <div class="brand">
    <span class="orb" aria-hidden="true"></span>
    <span><b>Exzi</b><span class="st" id="hdrStatus">Online · your AI companion</span></span>
  </div>
  <div class="hdr-actions">
    <button class="icon-btn on" id="ttsBtn" title="Exzi speaks replies aloud (click to mute)" aria-label="Toggle voice">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
    </button>
    <button class="icon-btn" id="clearBtn" title="Start a new conversation" aria-label="New chat">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
    </button>
    <a class="back" href="/#labs"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Home</a>
  </div>
</header>

<main class="thread" id="thread">
  <div class="thread-in" id="threadIn">
    <div class="welcome" id="welcome">
      <span class="orb big-orb" aria-hidden="true"></span>
      <h1>Hi, I'm <span class="g">Exzi</span></h1>
      <p>Your EXZELLENT companion. Ask me about languages, studying in Germany, careers — anything. Type or tap the mic to talk.</p>
      <div class="chips" id="chips">
        <button class="chip">How do I start learning German?</button>
        <button class="chip">Tips for studying in Germany</button>
        <button class="chip">Help me write a CV summary</button>
        <button class="chip">Teach me 5 useful German phrases</button>
      </div>
    </div>
  </div>
</main>

<div class="composer">
  <form class="composer-in" id="form">
    <textarea id="ta" rows="1" placeholder="Message Exzi…" autocomplete="off"></textarea>
    <button type="button" class="mic" id="mic" title="Speak to Exzi" aria-label="Voice input">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
    </button>
    <button type="submit" class="send" id="send" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <div class="hint" id="hint">Exzi can make mistakes. Tap the mic to talk — works in any modern browser.</div>
</div>

<script>
(function () {
  var thread = document.getElementById("thread");
  var threadIn = document.getElementById("threadIn");
  var welcome = document.getElementById("welcome");
  var form = document.getElementById("form");
  var ta = document.getElementById("ta");
  var send = document.getElementById("send");
  var mic = document.getElementById("mic");
  var ttsBtn = document.getElementById("ttsBtn");
  var clearBtn = document.getElementById("clearBtn");
  var hdrStatus = document.getElementById("hdrStatus");
  var hint = document.getElementById("hint");

  // ─── BACKEND ───────────────────────────────────────────────────────────────
  // Exzi is a STATIC page on Vercel, so a relative "/api/..." fetch would hit
  // Vercel (which has no /api functions) and 404 — it never reaches the API
  // server. The absolute URL below is required. In local dev the Vite proxy is
  // bypassed too, which is fine: the real backend allows localhost:3000 origins.
  var API_BASE = "https://exzellent-backend-1.onrender.com";
  var CHAT_URL = API_BASE + "/api/tools/aria";
  // Not implemented on the backend yet — see the note in transcribe().
  var TRANSCRIBE_URL = API_BASE + "/api/ai/transcribe";

  // The endpoint is a public, rate-limited, ONE-SHOT tutor: it accepts a single
  // {message, language} and keeps no server-side session. To give follow-ups
  // ("say that again simpler") some context, we prepend a short transcript of
  // recent turns and keep the whole thing inside the endpoint's 500-char cap.
  var LANG = "en";           // page is lang="en"; use "de" for the German prompt
  var MAX_MESSAGE = 500;     // endpoint rejects longer with HTTP 400
  var CONTEXT_TURNS = 4;     // how many prior messages to fold in

  var history = [];          // [{role:'user'|'assistant', content}]
  var busy = false;
  var ttsOn = true;
  var isRec = false;
  var defaultHint = hint.textContent;

  function setMood(m) { document.body.setAttribute("data-mood", m); }
  function setStatus(t) { hdrStatus.textContent = t; }

  // textarea autosize + enable send
  function resize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; send.disabled = !ta.value.trim() || busy; }
  ta.addEventListener("input", resize);
  ta.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  function addBubble(role, text) {
    if (welcome) { welcome.remove(); welcome = null; }
    var msg = document.createElement("div");
    msg.className = "msg " + (role === "user" ? "me" : "exzi");
    var av = document.createElement("span");
    av.className = "av";
    av.textContent = role === "user" ? "🙂" : "✦";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msg.appendChild(av); msg.appendChild(bubble);
    threadIn.appendChild(msg);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addThinking() {
    if (welcome) { welcome.remove(); welcome = null; }
    var msg = document.createElement("div");
    msg.className = "msg exzi";
    msg.id = "thinking";
    msg.innerHTML = '<span class="av">✦</span><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    threadIn.appendChild(msg);
    thread.scrollTop = thread.scrollHeight;
  }
  function removeThinking() { var t = document.getElementById("thinking"); if (t) t.remove(); }

  // ─── markdown -> plain text ────────────────────────────────────────────────
  // The model is asked for plain text, but LLMs still emit markdown. Bubbles
  // are rendered with textContent, so "**Hallo**" would show its asterisks,
  // and speech synthesis reads every symbol out loud ("star star Hallo").
  // Strip it for display, and strip a little more for speech.
  function plainText(s) {
    return String(s == null ? "" : s)
      .replace(/```[a-zA-Z]*\r?\n?([\s\S]*?)```/g, "$1")   // fenced code
      .replace(/`([^`\n]+)`/g, "$1")                        // inline code
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")             // images
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")              // links -> label
      .replace(/^\s{0,3}#{1,6}\s+/gm, "")                   // headings
      .replace(/^\s{0,3}>\s?/gm, "")                        // blockquotes
      .replace(/^\s*([-*_]\s*){3,}$/gm, "")                 // horizontal rules
      .replace(/^\s*[-*+]\s+/gm, "\u2022 ")                 // bullets -> •
      .replace(/\*\*\*([^*]+)\*\*\*/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g, "$1$2") // *italic*
      .replace(/(^|[^\w_])__([^_\n]+)__(?![\w_])/g, "$1$2")
      .replace(/(^|[^\w_])_([^_\n]+)_(?![\w_])/g, "$1$2")   // _italic_
      .replace(/[ \t]*\|[ \t]*/g, "  ")                      // table pipes
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  // Speech reads symbols and emoji aloud, so take those out too.
  function speechText(s) {
    return plainText(s)
      .replace(/https?:\/\/\S+/g, "")
      .replace(/[\u2022\u2013\u2014]/g, " ")
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}]/gu, "")
      .replace(/\s{2,}/g, " ")
      .trim();
  }

  function speak(text) {
    if (!ttsOn || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(speechText(text));
    u.rate = 1; u.pitch = 1;
    setMood("speaking"); setStatus("Speaking…");
    u.onend = function () { setMood("idle"); setStatus("Online · your AI companion"); };
    speechSynthesis.speak(u);
  }

  // Fold the tail of the conversation into one string, because the endpoint is
  // one-shot and has no memory. Trimmed from the OLDEST turn first so the
  // current question always survives the 500-char cap.
  function buildMessage(text) {
    if (text.length >= MAX_MESSAGE) return text.slice(0, MAX_MESSAGE);
    var prior = history.slice(-1 - CONTEXT_TURNS, -1);   // exclude the just-pushed turn
    while (prior.length) {
      var transcript = prior
        .map(function (m) { return (m.role === "user" ? "Me: " : "You: ") + m.content; })
        .join("\n");
      var candidate = transcript + "\nMe: " + text;
      if (candidate.length <= MAX_MESSAGE) return candidate;
      prior = prior.slice(1);                            // drop the oldest turn, retry
    }
    return text;
  }

  function errorFor(status, data) {
    var msg = data && data.message;
    if (status === 400) return msg || "That message was too long for me — could you shorten it?";
    if (status === 429) return "I'm getting a lot of questions right now. Please wait a moment and try again.";
    if (status === 404) return "Exzi isn't wired up on this server yet. Please let the team know.";
    if (status >= 500) return "My AI service is temporarily unavailable. Please try again in a minute.";
    return msg || "I couldn't generate a reply just now. Please try again.";
  }

  async function ask(text) {
    if (busy) return;
    busy = true; send.disabled = true;
    addBubble("user", text);
    history.push({ role: "user", content: text });
    addThinking();
    setMood("thinking"); setStatus("Thinking…");
    try {
      var res = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: buildMessage(text), language: LANG })
      });

      var data = null;
      try { data = await res.json(); } catch (_) { /* non-JSON error page */ }

      if (!res.ok) {
        removeThinking();
        addBubble("assistant", errorFor(res.status, data));
        setMood("idle"); setStatus("Online · your AI companion");
        return;
      }

      var reply = (data && (data.reply || data.message)) || "I couldn't generate a reply just now. Please try again.";
      removeThinking();
      addBubble("assistant", plainText(reply));
      history.push({ role: "assistant", content: reply });
      speak(reply);
      if (document.body.getAttribute("data-mood") !== "speaking") setStatus("Online · your AI companion");
    } catch (e) {
      // Only genuine network/CORS failures land here — HTTP errors are handled above.
      removeThinking();
      addBubble("assistant", "I can't reach the Exzellent servers right now. Please check your connection and try again.");
      setMood("idle"); setStatus("Offline");
    } finally {
      busy = false; resize();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = ta.value.trim();
    if (!text || busy) return;
    ta.value = ""; resize();
    ask(text);
  });

  // suggestion chips
  document.getElementById("chips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) ask(chip.textContent.trim());
  });

  // TTS toggle
  ttsBtn.addEventListener("click", function () {
    ttsOn = !ttsOn;
    ttsBtn.classList.toggle("on", ttsOn);
    ttsBtn.title = ttsOn ? "Exzi speaks replies aloud (click to mute)" : "Replies are muted (click to unmute)";
    if (!ttsOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  // new chat
  clearBtn.addEventListener("click", function () {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    history = [];
    threadIn.innerHTML = "";
    location.reload();
  });

  // voice input — records with MediaRecorder (works in EVERY browser, Opera
  // included) and transcribes server-side with Groq Whisper.
  var mediaRecorder = null, mediaStream = null, audioChunks = [];

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      hint.textContent = "This browser can't record audio. Try a recent Chrome, Edge, Firefox, Opera or Safari.";
      return;
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      hint.textContent = (e && e.name === "NotAllowedError")
        ? "Microphone blocked — click the mic/lock icon in the address bar, allow access, then retry."
        : "Couldn't access the microphone: " + (e && e.message ? e.message : e);
      return;
    }
    audioChunks = [];
    try { mediaRecorder = new MediaRecorder(mediaStream); }
    catch (e) { mediaRecorder = new MediaRecorder(mediaStream, {}); }
    mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) audioChunks.push(e.data); };
    mediaRecorder.onstop = transcribe;
    mediaRecorder.start();
    isRec = true;
    mic.classList.add("rec");
    setStatus("Listening…");
    hint.textContent = "Listening — tap the mic again when you're done.";
  }

  function stopRecording() {
    try { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); } catch (e) {}
    if (mediaStream) mediaStream.getTracks().forEach(function (t) { t.stop(); });
    isRec = false;
    mic.classList.remove("rec");
    setStatus("Transcribing…");
  }

  async function transcribe() {
    var type = (audioChunks[0] && audioChunks[0].type) || "audio/webm";
    var blob = new Blob(audioChunks, { type: type });
    if (!blob.size) { setStatus("Online · your AI companion"); hint.textContent = defaultHint; return; }
    // NOTE: there is no public transcription endpoint yet. The backend's
    // /api/pronunciation/transcribe and /api/speech routes both require a
    // logged-in user AND a multipart upload, while Exzi is anonymous and posts
    // a raw blob. Until a public route exists, voice input cannot work here —
    // so fail with an honest message rather than blaming the backend.
    try {
      var res = await fetch(TRANSCRIBE_URL, { method: "POST", headers: { "Content-Type": type }, body: blob });
      var data = null;
      try { data = await res.json(); } catch (_) {}
      setStatus("Online · your AI companion");
      if (res.ok && data && data.success && data.text) { hint.textContent = defaultHint; ask(data.text); }
      else if (res.status === 404) { hint.textContent = "Voice input isn't available yet — please type your question."; }
      else { hint.textContent = "Couldn't catch that: " + ((data && data.message) || "no speech detected") + ". Try again."; }
    } catch (e) {
      setStatus("Online · your AI companion");
      hint.textContent = "Voice input isn't available yet — please type your question.";
    }
  }

  mic.addEventListener("click", function () {
    if (isRec) stopRecording(); else startRecording();
  });

  // Embedded mode (opened as a popup from another page): hide the "Home" link,
  // and auto-send an initial ?q= message if one was passed in.
  var params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.body.classList.add("embed");
  var q0 = (params.get("q") || "").trim();
  if (q0) { setTimeout(function () { ask(q0); }, 350); }

  resize();
  ta.focus();
})();
</script>
