   EXZELLENT · petals — twelve petals, one rotating stack
   No hero copy. The stack speaks first; the story of the active petal
   lives below it and swaps as the stack turns.

[data-theme="light"]{
  --bg:#F2F3FA; --surface:rgba(255,255,255,.88); --solid:#FFFFFF;
  --line:rgba(21,27,63,.12); --line2:rgba(21,27,63,.26);
  --text:#0B0E1E; --muted:#454E71; --dim:#7A82A3;
  --goldT:#8A6608; --goldB:rgba(122,92,8,.92); --goldDim:rgba(122,92,8,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .6s,color .6s;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgb(var(--acc));outline-offset:3px;border-radius:10px}
::selection{background:rgba(var(--acc),.35)}
.wrap{width:min(1220px,94vw);margin-inline:auto}

.atmos{position:fixed;inset:0;pointer-events:none;z-index:0}
.atmos i{position:absolute;border-radius:50%;filter:blur(90px);transition:background 1s}
.atmos i:nth-child(1){width:58vmax;height:58vmax;left:-16vmax;top:-22vmax;background:rgba(var(--acc),.14)}
.atmos i:nth-child(2){width:46vmax;height:46vmax;right:-14vmax;bottom:-18vmax;background:rgba(var(--acc),.08)}
.bigstar{position:fixed;left:50%;top:52%;z-index:0;pointer-events:none;
  width:min(84vmin,900px);aspect-ratio:240/159;background-image:var(--logo-url);
  background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.045;
  transform:translate(-50%,-50%);will-change:transform}
[data-theme="light"] .bigstar{opacity:.06}

/* ================= header ================= */
.hdr{position:fixed;inset:0 0 auto 0;z-index:70;height:var(--nav);display:flex;align-items:center;
  background:transparent;border-bottom:1px solid transparent;transition:background .35s,border-color .35s}
.hdr.scrolled{background:rgba(4,5,10,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
[data-theme="light"] .hdr.scrolled{background:rgba(242,243,250,.9)}
.hdr-in{display:flex;align-items:center;gap:10px;width:min(1240px,94vw);margin-inline:auto}
.brand{display:flex;align-items:center;gap:11px;font:700 14px/1 "Space Grotesk",sans-serif;letter-spacing:.14em}
.mark{width:52px;aspect-ratio:880/583;height:auto;background-image:var(--logo-url);background-size:contain;
  background-position:center;background-repeat:no-repeat;flex:none;transform-origin:center;
  filter:drop-shadow(0 0 12px rgba(var(--acc),.75)) drop-shadow(0 0 34px rgba(138,75,245,.5));
  animation:beat 2.4s ease-in-out infinite}
@keyframes beat{ /* da-dum … rest */
  0%,42%,100%{transform:scale(1);filter:drop-shadow(0 0 12px rgba(var(--acc),.75)) drop-shadow(0 0 34px rgba(138,75,245,.5))}
  8%{transform:scale(1.14);filter:drop-shadow(0 0 26px rgba(var(--acc),1)) drop-shadow(0 0 60px rgba(138,75,245,.85))}
  16%{transform:scale(1)}
  24%{transform:scale(1.09);filter:drop-shadow(0 0 20px rgba(var(--acc),.9)) drop-shadow(0 0 48px rgba(138,75,245,.7))}}
.petalwrap{position:relative;margin-left:6px}
.petalbtn{display:inline-flex;align-items:center;gap:8px;padding:.55em .9em;border-radius:999px;
  border:1px solid rgba(var(--acc),.4);background:rgba(var(--acc),.10);
  font:600 12px/1 Inter,sans-serif;letter-spacing:.06em;color:var(--text);transition:border-color .25s,background .25s;max-width:56vw}
.petalbtn .pt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.petalbtn:hover,.petalbtn[aria-expanded="true"]{border-color:rgb(var(--acc));background:rgba(var(--acc),.16)}
.petalbtn .car{font-size:8px;color:var(--vio2);transition:transform .25s var(--ease);flex:none}
.petalbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.petalbtn small{font:600 9px/1 Inter,sans-serif;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;flex:none}
.pmenu{position:absolute;left:0;top:calc(100% + 10px);min-width:320px;border-radius:16px;border:1px solid var(--line);
  background:rgba(10,12,22,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 26px 70px rgba(0,0,0,.55);padding:12px;opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:opacity .3s var(--ease),transform .3s var(--ease),visibility 0s .3s;max-height:min(72svh,600px);overflow-y:auto}
[data-theme="light"] .pmenu{background:rgba(255,255,255,.98);box-shadow:0 26px 60px rgba(30,35,80,.2)}
.petalwrap[data-open="true"] .pmenu{opacity:1;visibility:visible;transform:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.pmenu .mh{font:600 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:6px 8px 8px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font:600 13px/1.2 Inter,sans-serif;color:var(--muted);transition:background .2s,color .2s;width:100%;text-align:left}
.mi:hover{background:rgba(148,163,215,.08);color:var(--text)}
.mi i{font-style:normal;font:700 10px/1 "Space Grotesk",sans-serif;color:rgb(var(--mc));width:18px;flex:none}
.mi b{width:6px;height:6px;border-radius:50%;background:rgb(var(--mc));box-shadow:0 0 8px rgba(var(--mc),.8);flex:none}
.mi[aria-current="true"]{color:var(--text);background:rgba(var(--mc),.1)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.u-btn{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);
  font:500 12.5px/1 Inter,sans-serif;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:color .25s,border-color .25s}
.u-btn:hover{color:var(--text);border-color:var(--line2)}
.a-start{padding:.66em 1.15em;border-radius:999px;font:600 13px/1 Inter,sans-serif;color:var(--ink);
  background:linear-gradient(100deg,rgb(var(--acc)),var(--lav));box-shadow:0 6px 22px rgba(var(--acc),.35);
  transition:transform .25s var(--ease),box-shadow .25s;white-space:nowrap}
.a-start:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(var(--acc),.5)}
@media(max-width:700px){.u-btn .lbl{display:none}.a-start{display:none}}

/* ================= 3D petal stack ================= */
.mazeSec{position:relative;z-index:6;padding:calc(var(--nav) + 22px) 0 4px;overflow-x:clip;overflow-y:visible}
.maze{position:relative;height:clamp(440px,calc(100svh - 262px),620px);perspective:1300px;perspective-origin:50% 42%}
.maze .floorx{position:absolute;left:50%;bottom:-8%;width:160%;height:70%;transform:translateX(-50%) rotateX(76deg);
  background:repeating-linear-gradient(rgba(var(--acc),.10) 0 2px,transparent 2px 72px),
             repeating-linear-gradient(90deg,rgba(var(--acc),.10) 0 2px,transparent 2px 72px);
  mask-image:radial-gradient(60% 90% at 50% 0%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(60% 90% at 50% 0%,#000 30%,transparent 78%);
  transition:background 1s;pointer-events:none}
.track{position:absolute;inset:0;transform-style:preserve-3d}
.card{position:absolute;left:50%;top:0;width:min(880px,86%);height:calc(100% - 26px);margin-left:calc(min(880px,86%)/-2);
  border-radius:24px;border:1px solid rgba(var(--c),.34);
  background:linear-gradient(155deg,rgba(var(--c),.12),var(--surface) 46%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 -1px 0 rgba(255,255,255,.05) inset,0 28px 70px rgba(0,0,0,.5),0 10px 40px rgba(var(--c),.12);
  transition:transform .65s var(--ease),opacity .65s var(--ease),filter .65s var(--ease);
  will-change:transform,opacity;cursor:pointer;overflow:hidden}
.card::after{content:"";position:absolute;right:-6%;bottom:-9%;width:min(44%,300px);aspect-ratio:880/583;
  background:var(--logo-url) center/contain no-repeat;opacity:.055;pointer-events:none}
[data-theme="light"] .card{box-shadow:0 28px 60px rgba(30,35,80,.16),0 10px 36px rgba(var(--c),.14)}
.card.on{cursor:default}
.card:not(.on) .in{pointer-events:none}
.card .in{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);
  grid-template-columns:1.1fr .9fr;gap:clamp(12px,2vw,26px) clamp(16px,2.6vw,36px);
  padding:clamp(14px,2.4vw,30px);backface-visibility:hidden}
/* --- card head: the logo, the petal number, and the tabs --- */
.chead{grid-column:1/-1;display:flex;align-items:center;gap:13px;min-width:0;
  padding-bottom:clamp(9px,1.2vw,13px);border-bottom:1px solid rgba(var(--c),.2)}
.cmark{width:clamp(38px,3.4vw,48px);aspect-ratio:880/583;flex:none;
  background:var(--logo-url) center/contain no-repeat;filter:drop-shadow(0 0 12px rgba(var(--c),.6))}
.cbrand{font:700 12px/1 "Space Grotesk",sans-serif;letter-spacing:.16em;color:var(--text);opacity:.9}
.chead .pnT{margin-left:auto}
.pnT{font:600 10.5px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;
  color:var(--goldT);white-space:nowrap}
.ctabs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;margin:0 0 22px;
  scrollbar-width:none;scroll-snap-type:x proximity}
.ctabs::-webkit-scrollbar{display:none}
.ct{display:inline-flex;align-items:center;gap:8px;padding:.62em 1.05em;border-radius:999px;
  border:1px solid var(--line2);background:var(--surface);
  font:600 12.5px/1 Inter,sans-serif;color:var(--muted);white-space:nowrap;
  scroll-snap-align:end;transition:color .25s,border-color .25s,background .25s,transform .25s var(--ease)}
.ct:hover{transform:translateY(-1px)}
.ct i{width:7px;height:7px;border-radius:50%;background:rgb(var(--sc,var(--c)));flex:none;
  box-shadow:0 0 8px rgba(var(--sc,var(--c)),.55);transition:box-shadow .25s}
.ct:hover{color:var(--text)}
.ct.on{color:var(--goldT);border-color:rgba(var(--c),.65);background:rgba(var(--c),.14)}
.ct.on i{box-shadow:0 0 12px rgba(var(--sc,var(--c)),.95)}
.side{display:flex;flex-direction:column;justify-content:center;min-width:0}
.side .pn{font:600 10.5px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgb(var(--c));
  display:flex;align-items:center;gap:.8em;margin-bottom:12px}
.side .pn::before{content:"";width:20px;height:2px;border-radius:2px;background:rgb(var(--c))}
.side h2{font:700 clamp(22px,3vw,36px)/1.1 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin-bottom:11px;color:var(--goldT)}
.side .ident{color:var(--goldB);font-size:clamp(13.5px,1.35vw,15.5px);max-width:38ch;margin-bottom:22px}
.gorow{display:flex;gap:10px;flex-wrap:wrap}
.go{display:inline-flex;align-items:center;gap:.65em;
  padding:.9em 1.4em;border-radius:14px;font:600 14.5px/1 Inter,sans-serif;color:var(--ink);
  background:linear-gradient(100deg,rgb(var(--c)),rgba(var(--c),.72));
  box-shadow:0 12px 34px rgba(var(--c),.32);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.go:hover{transform:translateY(-2px);box-shadow:0 16px 46px rgba(var(--c),.48)}
.go .ar{transition:transform .3s var(--ease)}
.go:hover .ar{transform:translateX(5px)}
.story-link{display:inline-flex;align-items:center;gap:.55em;padding:.9em 1.2em;border-radius:14px;
  font:600 13.5px/1 Inter,sans-serif;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.story-link:hover{color:var(--text);border-color:var(--line2)}
/* film + mocks */
.cine{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(var(--c),.24);
  background:radial-gradient(120% 120% at 20% 0%,rgba(var(--c),.14),rgba(4,5,10,.5) 55%);min-height:0}
[data-theme="light"] .cine{background:radial-gradient(120% 120% at 20% 0%,rgba(var(--c),.14),rgba(255,255,255,.5) 55%)}
.scene{position:absolute;inset:0;display:grid;place-items:center;padding:clamp(12px,2.2vw,28px);
  opacity:0;transform:scale(1.015);transition:opacity 1s var(--ease),transform 6s linear}
.scene.on{opacity:1;transform:scale(1.05)}
.cap{position:absolute;left:16px;bottom:13px;font:600 10.5px/1 Inter,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--goldDim);display:flex;align-items:center;gap:8px}
.cap i{width:16px;height:2px;border-radius:2px;background:rgb(var(--c))}
.dots{position:absolute;right:14px;bottom:14px;display:flex;gap:5px}
.dots b{width:5px;height:5px;border-radius:50%;background:rgba(var(--c),.28);transition:background .4s,transform .4s}
.dots b.on{background:rgb(var(--c));transform:scale(1.3)}
.mock{width:min(420px,94%);border-radius:15px;border:1px solid var(--line);
  background:var(--solid);box-shadow:0 22px 55px rgba(0,0,0,.35);padding:14px 15px;font-size:12.5px}
[data-theme="light"] .mock{box-shadow:0 22px 55px rgba(30,35,80,.14)}
.mock .mh{display:flex;align-items:center;gap:8px;font:600 11.5px/1 Inter,sans-serif;color:var(--dim);margin-bottom:10px}
.mock .mh i{width:8px;height:8px;border-radius:50%;background:rgb(var(--c))}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:none}
.bar{flex:1;height:6px;border-radius:999px;background:rgba(148,163,215,.16);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:rgb(var(--c))}
.bub{max-width:85%;padding:8px 11px;border-radius:12px;border:1px solid var(--line);margin:5px 0;font-size:12px}
.bub.me{margin-left:auto;background:rgba(var(--c),.14);border-color:rgba(var(--c),.3)}
.wave{display:flex;align-items:flex-end;gap:3px;height:28px;margin:8px 0 5px}
.wave i{width:4px;border-radius:2px;background:rgb(var(--c));height:30%;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{height:95%}}
.chip{display:inline-block;padding:.4em .75em;border-radius:999px;border:1px solid var(--line);
  font:500 11.5px/1 Inter,sans-serif;color:var(--muted);margin:3px 4px 0 0}
.chip.on{background:rgba(var(--c),.15);border-color:rgb(var(--c));color:var(--text)}
.ring{width:66px;height:66px;border-radius:50%;flex:none;
  background:conic-gradient(rgb(var(--c)) calc(var(--v)*1%),rgba(148,163,215,.16) 0);display:grid;place-items:center}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font:700 12px/1 "Space Grotesk",sans-serif}
.tk{display:flex;align-items:center;gap:9px;padding:6px 0;color:var(--muted);font-size:12px}
.tk b{width:16px;height:16px;flex:none;border-radius:6px;border:1px solid rgba(var(--c),.5);display:grid;place-items:center;font-size:10px;color:rgb(var(--c))}

/* rail — all twelve, always visible */
.rail12{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;padding:14px 0 2px}
.r9{display:inline-flex;align-items:center;gap:7px;padding:.5em .85em;border-radius:999px;border:1px solid transparent;
  font:600 11.5px/1 Inter,sans-serif;color:var(--dim);transition:color .25s,border-color .25s,background .25s}
.r9 i{font-style:normal;font:700 9.5px/1 "Space Grotesk",sans-serif;letter-spacing:.05em}
.r9 b{width:5px;height:5px;border-radius:50%;background:rgb(var(--tc));flex:none}
.r9:hover{color:var(--text)}
.r9[aria-selected="true"]{color:var(--text);border-color:rgba(var(--tc),.55);background:rgba(var(--tc),.12)}
.mazenav{display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0 6px}
.st{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;transition:color .25s,border-color .25s}
.st:hover{color:var(--text);border-color:var(--line2)}
.auto{font:600 10px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  display:inline-flex;align-items:center;gap:7px}
.auto i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.auto.off i{background:var(--dim);box-shadow:none}

/* --- scroll down to the story: outside the card, with arrows --- */
.scue{display:flex;flex-direction:column;align-items:center;gap:9px;margin:clamp(18px,3vh,34px) auto 0;
  padding:14px 22px 12px;border-radius:18px;border:1px solid transparent;background:transparent;
  color:var(--dim);transition:color .25s var(--ease),border-color .25s,background .25s}
.scue:hover{color:var(--text);border-color:rgba(var(--acc),.4);background:rgba(var(--acc),.07)}
.scT{font:600 11.5px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.scA{position:relative;display:block;width:26px;height:24px;animation:bob 2.1s ease-in-out infinite}
.scA i{position:absolute;left:50%;top:0;width:14px;height:14px;margin-left:-7px;
  border-right:2.5px solid rgb(var(--acc));border-bottom:2.5px solid rgb(var(--acc));
  border-radius:2px;transform:rotate(45deg);opacity:.9}
.scA i:nth-child(2){top:8px;opacity:.42}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.scue:hover .scA i{opacity:1}
@media(prefers-reduced-motion:reduce){.scA{animation:none}}

/* ================= the story of the active petal ================= */
.story{position:relative;z-index:2;padding:clamp(30px,5vh,58px) 0 20px}
.story .eyebrow{font:600 11px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgb(var(--sc))}
.story h2{font:700 clamp(26px,3.6vw,44px)/1.1 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:12px 0 12px;color:var(--goldT)}
.story .lead{color:var(--muted);max-width:62ch;font-size:15.5px}
.spts{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin:24px 0 6px}
.sp{display:flex;gap:.8em;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.sp b{color:rgb(var(--sc));font-weight:700;flex:none}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.room{border-radius:16px;border:1px solid rgba(var(--rc),.32);
  background:linear-gradient(160deg,rgba(var(--rc),.12),var(--surface) 58%);padding:18px 17px;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.room:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(var(--rc),.16)}
.room .e{font:600 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgb(var(--rc))}
.room h4{font:700 14.5px/1.3 "Space Grotesk",sans-serif;margin:8px 0 6px}
.room .m{font:600 12px/1 Inter,sans-serif;color:rgb(var(--rc))}
.sactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.rev{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rev.in{opacity:1;transform:none}
@media(max-width:860px){.spts{grid-template-columns:1fr}.rooms{grid-template-columns:1fr}}

footer{position:relative;z-index:2;border-top:1px solid var(--line);margin-top:70px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:22px 0 calc(22px + env(safe-area-inset-bottom));color:var(--dim);font-size:13px}

/* ================= Exzi buddy ================= */
.buddy{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:75;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.borb{position:relative;width:70px;height:70px;border-radius:50%;border:1.5px solid rgba(138,75,245,.55);
  background:radial-gradient(120% 120% at 30% 20%,rgba(138,75,245,.42),var(--solid) 74%);
  display:grid;place-items:center;box-shadow:0 14px 40px rgba(138,75,245,.35);transition:transform .3s var(--ease)}
[data-theme="light"] .borb{background:radial-gradient(120% 120% at 30% 20%,rgba(201,170,255,.55),#fff 76%);
  box-shadow:0 14px 38px rgba(138,75,245,.28)}
.borb:hover{transform:translateY(-2px)}
.borb b{width:40px;aspect-ratio:880/583;background-image:var(--logo-url);background-size:contain;background-position:center;background-repeat:no-repeat;
  filter:drop-shadow(0 0 8px rgba(138,75,245,.55))}
.borb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(103,232,249,.4);animation:ring2 2.6s ease-out infinite}
@keyframes ring2{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.35);opacity:0}}
.borb i{position:absolute;right:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);border:2px solid var(--bg)}
.bpanel{width:min(320px,86vw);border-radius:18px;border:1px solid rgba(103,232,249,.35);
  background:rgba(10,12,22,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 26px 70px rgba(0,0,0,.55);padding:14px;
  opacity:0;visibility:hidden;transform:translateY(10px);transition:all .35s var(--ease)}
[data-theme="light"] .bpanel{background:rgba(255,255,255,.98)}
.buddy[data-open="true"] .bpanel{opacity:1;visibility:visible;transform:none}
.bpanel .bh{display:flex;align-items:center;gap:8px;font:600 10px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
.bpanel .bh i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.bpanel .ask2{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:13px;border:1px solid var(--line);background:var(--surface);margin-bottom:9px}
.bpanel .ask2 .ph{flex:1;font:500 12.5px/1.3 Inter,sans-serif;color:var(--dim);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bpanel .row{display:flex;gap:8px}
.iconb{height:38px;flex:1;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:color .25s,border-color .25s}
.iconb:hover{color:var(--text);border-color:var(--line2)}
.iconb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bpanel .note2{margin-top:9px;font:500 10.5px/1.45 Inter,sans-serif;color:var(--dim)}

/* ================= responsive ================= */
/* ---------- tablet ---------- */
@media(max-width:1024px){
  .maze{perspective:1050px}
  .card{width:90%;margin-left:-45%}
  .card .in{grid-template-columns:1fr .95fr}
}
/* ---------- phone: the card becomes a single column ---------- */
@media(max-width:760px){
  .mazeSec{padding-top:calc(var(--nav) + 14px)}
  .petalbtn{max-width:34vw}
  .hdr-in{gap:6px}
  .hright{gap:6px}
  .ptsbtn{padding:0 9px;font-size:11.5px;height:32px}
  .chead{gap:10px}
  .cmark{width:36px}
  .cbrand{font-size:11px;letter-spacing:.12em}
  .ctabs{flex-wrap:nowrap;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
  .ctabs::-webkit-scrollbar{display:none}
  .ct{padding:.55em .85em;font-size:12px}
  .maze{height:clamp(430px,calc(100svh - 236px),580px);perspective:820px;perspective-origin:50% 46%}
  .card{width:92%;margin-left:-46%;border-radius:20px}
  .card .in{grid-template-columns:1fr;grid-template-rows:auto minmax(110px,1fr) auto;
    gap:10px;padding:13px}
  .chead{gap:9px;padding-bottom:9px}
  .pnT{font-size:9.5px;letter-spacing:.14em}
  .ct{padding:.48em .7em;font-size:11px}
  .side{justify-content:flex-end;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .side h2{font-size:clamp(20px,5.6vw,27px);margin-bottom:8px}
  .side .ident{font-size:13.5px;margin-bottom:14px;max-width:none}
  .gorow{width:100%}
  .go,.story-link{flex:1;justify-content:center;padding:.95em 1em;font-size:14px}
  .scene{padding:10px}
  .scene.on{transform:none}
  .cap{display:none}
  .mock{width:min(330px,96%);font-size:11.5px;padding:12px 13px}
  .mazenav{gap:14px;padding:8px 0 4px}
  .st{width:46px;height:46px;border-radius:14px}
  .rail12{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;
    padding:12px 2px 4px;scroll-snap-type:x proximity}
  .rail12::-webkit-scrollbar{display:none}
  .r9{flex:none;scroll-snap-align:center;padding:.55em .8em}
  .r9 span{display:inline}
  .r9:first-child{margin-left:auto}
  .r9:last-child{margin-right:auto}
  .story{padding-top:clamp(34px,6vh,56px)}
  .buddy{right:12px;bottom:12px}
}
/* ---------- small phone ---------- */
@media(max-width:560px){
  .brand{font-size:0;gap:0}          /* the mark carries the brand on small phones */
  .mark{width:44px}
  .petalbtn{max-width:36vw;padding:.5em .7em}
  .ptsbtn{padding:0 8px;font-size:11px}
  .u-btn{min-width:32px;padding:0 7px}
}
@media(max-width:400px){
  .petalbtn small{display:none}
  .petalbtn{max-width:32vw}
  .ptsbtn{padding:0 7px}
}
@media(max-width:420px){
  .maze{height:clamp(410px,calc(100svh - 224px),540px);perspective:700px}
  .card{width:94%;margin-left:-47%}
  .card .in{grid-template-rows:auto minmax(110px,1fr) auto;padding:11px}
  .cmark{width:32px}
  .cbrand{display:none}
  .side h2{font-size:clamp(19px,6vw,24px)}
  .go,.story-link{font-size:13.5px}
}
/* ---------- landscape phone: keep the stage usable ---------- */
@media(max-height:560px) and (orientation:landscape){
  .maze{height:calc(100svh - 168px);min-height:300px}
  .card .in{grid-template-rows:auto minmax(0,1fr);grid-template-columns:1fr 1fr;padding:12px}
  .side .ident{margin-bottom:12px}
  .rail12{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .card{transition:opacity .2s linear}
  .scene{transition:opacity .3s linear;transform:none!important}
  .wave i{animation:none;height:60%}
  .rev{opacity:1;transform:none;transition:none}
  .borb::after{animation:none}
  .go:hover,.a-start:hover,.room:hover,.borb:hover{transform:none}
}
/* ---------- status badges: where each petal really stands ---------- */
.cst{display:inline-flex;align-items:center;gap:7px;padding:.42em .8em;border-radius:3px 14px 3px 14px;
  border:1px solid var(--line2);font:600 10px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap}
.cst i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.cst.live{color:var(--green);border-color:rgba(61,240,160,.5);background:rgba(61,240,160,.10)}
.cst.live i{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 15px var(--green)}}
.sbadge{display:inline-flex;align-items:center;gap:7px;margin-left:12px;padding:.34em .7em;border-radius:3px 12px 3px 12px;
  border:1px solid var(--line2);font:600 9.5px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);vertical-align:middle}
.sbadge.live{color:var(--green);border-color:rgba(61,240,160,.5);background:rgba(61,240,160,.10)}
.sbadge i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}

/* ---------- the rail: twelve petals you can play with ---------- */
.r9{position:relative;overflow:hidden;border-radius:4px 16px 4px 16px}
.r9:hover{transform:translateY(-2px)}
.r9 em{font-style:normal;font:700 8.5px/1 Inter,sans-serif;letter-spacing:.12em;color:var(--dim);
  padding:.28em .45em;border-radius:4px;background:rgba(148,163,215,.12);margin-left:2px}
.r9.islive em{color:var(--green);background:rgba(61,240,160,.14)}
.r9[aria-selected="true"] em{color:var(--text)}
.rp{position:absolute;left:0;bottom:0;height:2px;width:0;background:rgb(var(--tc));opacity:.9}
.r9[aria-selected="true"] .rp{animation:rp 5.2s linear forwards}
.rail12.slow .r9[aria-selected="true"] .rp{animation-duration:9s}
.rail12.paused .r9[aria-selected="true"] .rp{animation-play-state:paused}
.rail12.off .rp{animation:none;width:0}
@keyframes rp{from{width:0}to{width:100%}}

/* ---------- motion options ---------- */
.motionwrap{position:relative}
.auto .car{font-size:8px;margin-left:2px;transition:transform .25s var(--ease)}
.auto[aria-expanded="true"] .car{transform:rotate(180deg)}
.mopts{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,8px);min-width:210px;
  background:rgba(10,12,22,.97);border:1px solid var(--line);border-radius:16px;padding:10px;z-index:60;
  box-shadow:0 26px 60px rgba(0,0,0,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;visibility:hidden;transition:opacity .28s var(--ease),transform .28s var(--ease),visibility 0s .28s}
[data-theme="light"] .mopts{background:rgba(255,255,255,.98);box-shadow:0 26px 55px rgba(30,35,80,.18)}
.motionwrap[data-open="true"] .mopts{opacity:1;visibility:visible;transform:translate(-50%,0);
  transition:opacity .28s var(--ease),transform .28s var(--ease)}
.mopts .mh{font:600 9.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:8px 8px 6px}
.mopts button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;
  font:600 12.5px/1 Inter,sans-serif;color:var(--muted);transition:background .2s,color .2s}
.mopts button:hover{background:rgba(148,163,215,.09);color:var(--text)}
.mopts button.on{color:var(--text);background:rgba(var(--acc),.16)}
.mopts button::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35}

/* ===== fix: the Exzi buddy swallowed taps across a 320x251 area ===========
   .bpanel keeps its layout box when closed (visibility:hidden, not display:none),
   so the .buddy flex container stays ~320x251 even though only the 70x70 orb is
   visible. The container is transparent but still hit-testable, so it silently
   ate clicks on anything underneath it. On a 390px phone that is 82% of the
   screen width, which is why "Enter" on the Learning Ecosystem petal did nothing
   on mobile but worked on desktop.
   The container is now click-through; only the real controls take pointer events. */
.buddy{ pointer-events:none; }
.buddy .borb,
.buddy .bpanel{ pointer-events:auto; }

/* ============ 3D placement ============ */
/* the stack adapts to the window it is opened in */
function geo(){
  const w=innerWidth,h=innerHeight;
  if(w<=420)  return {sx:92,z:-150,ry:24,ex:0, near:1,blur:2,  op:[.5,.22],far:130};
  if(w<=760)  return {sx:88,z:-165,ry:27,ex:0, near:1,blur:2.2,op:[.55,.24],far:135};
  if(w<=1024) return {sx:74,z:-172,ry:33,ex:26,near:2,blur:2.4,op:[.7,.34],far:140};
  if(h<=620)  return {sx:60,z:-175,ry:35,ex:40,near:2,blur:2.4,op:[.72,.36],far:140};
  return       {sx:62,z:-190,ry:38,ex:46,near:2,blur:2.5,op:[.75,.38],far:140};
}
const S3D={flow:{sx:1,z:1,ry:1,ty:0,sc:1},wheel:{sx:1.16,z:1.75,ry:1.55,ty:0,sc:.95},deck:{sx:.22,z:1.2,ry:.1,ty:30,sc:.9}};
function place(){
  const g=geo(), S=S3D[style3d]||S3D.flow;
  cards.forEach((el,i)=>{
    const d=i-active, ad=Math.abs(d);
    el.classList.toggle("on",d===0);
    if(d===0){
      el.style.transform=`translateX(0) translateZ(0) rotateY(0deg)`;
      el.style.opacity=1; el.style.zIndex=40; el.style.filter="none"; el.style.pointerEvents="auto";
    }else if(ad<=g.near){
      const sx=g.sx*S.sx*d, rz=(g.z*S.z)*ad-(ad>1?g.z*S.z:0), ry=(d>0?-1:1)*(g.ry*S.ry+(ad>1?8:0)),
            ex=ad>1?(d>0?g.ex:-g.ex):0, ty=S.ty*ad, sc=Math.pow(S.sc,ad);
      el.style.transform=`translateX(calc(${sx}% + ${ex}px)) translateY(${ty}px) translateZ(${rz}px) rotateY(${ry}deg) scale(${sc.toFixed(3)})`;
      el.style.opacity=ad>1?g.op[1]:g.op[0];
      el.style.zIndex=40-ad; el.style.filter=`blur(${ad>1?g.blur:0}px)`; el.style.pointerEvents="auto";
    }else{
      el.style.transform=`translateX(${g.far*Math.sign(d)}%) translateZ(-560px) rotateY(${d>0?-52:52}deg)`;
      el.style.opacity=0; el.style.zIndex=10; el.style.pointerEvents="none";
    }
  });
  document.documentElement.style.setProperty("--acc",PETALS[active].c);
  railBtns.forEach((b,i)=>b.setAttribute("aria-selected",String(i===active)));
  document.getElementById("pbName").textContent=PETALS[active].n[lang];
  document.getElementById("pbOf").textContent=(active+1)+" / 12";
  document.getElementById("live").textContent=PETALS[active].n[lang];
  const sc=document.getElementById("scue");
  if(sc)sc.querySelector(".scT").textContent=T().readStory.replace("{n}",PETALS[active].n[lang]);
  railBtns[active]&&railBtns[active].scrollIntoView({block:"nearest",inline:"center",behavior:reduced?"auto":"smooth"});
  syncRail(); dwell();
  history.replaceState(null,"","#p"+String(active+1).padStart(2,"0"));
  renderStory(); cycle();
}
function show(i,user){
  i=(i+PETALS.length)%PETALS.length;
  if(user)pauseAuto();
  if(i===active)return; active=i; place();
}

/* scene cycler — active card only */
let sceneTimer=null;
function paintScene(el,n){
  const sc=[...el.querySelectorAll(".scene")], tb=[...el.querySelectorAll(".ct")];
  sc.forEach((x,k)=>x.classList.toggle("on",k===n));
  tb.forEach((x,k)=>{x.classList.toggle("on",k===n);x.setAttribute("aria-selected",String(k===n));});
  const cap=el.querySelector(".capT");
  if(cap&&sc[n]){const key=sc[n].dataset.k;cap.textContent=(SLAB[key]&&SLAB[key][lang])||cap.textContent;}
}
function cycle(){
  clearInterval(sceneTimer);
  const el=cards[active], sc=[...el.querySelectorAll(".scene")];
  if(sc.length<2)return;
  if(tabHold&&Date.now()-tabHold<14000){
    sceneTimer=setTimeout(cycle,14000-(Date.now()-tabHold)); return;
  }
  let n=sc.findIndex(x=>x.classList.contains("on")); if(n<0)n=0;
  sceneTimer=setInterval(()=>{
    if(tabHold&&Date.now()-tabHold<14000)return;
    n=(n+1)%sc.length; paintScene(el,n);
  },reduced?5200:3600);
}
/* tabs inside the card — tap to switch the scene yourself */
let tabHold=0;
track.addEventListener("click",e=>{
  const b=e.target.closest(".ct"); if(!b)return;
  e.preventDefault(); e.stopPropagation();
  const card=b.closest(".card"), i=+card.dataset.i;
  if(i!==active){show(i,true);return;}
  tabHold=Date.now(); pauseAuto();
  paintScene(card,+b.dataset.s);
});

/* ============ motion: how it turns, and how it looks turning ============ */
let dir=1, lastUser=0, storyVisible=false, autoTimer=null;
let motion="auto", style3d="flow";
try{motion=localStorage.getItem("exz-motion")||"auto";style3d=localStorage.getItem("exz-style")||"flow";}catch(e){}
if(reduced)motion="off";
const SPEED={auto:5200,drift:9000,off:0};
const autoBtn=document.getElementById("autoBtn"), mwrap=document.getElementById("motionwrap"), mopts=document.getElementById("mopts");
const autoOnNow=()=>motion!=="off"&&!reduced;
function buildMopts(){
  const t=T();
  mopts.innerHTML=`<div class="mh">${t.motion}</div>`+
    [["auto",t.mAuto],["drift",t.mDrift],["off",t.mOff]].map(m=>`<button data-m="${m[0]}" class="${motion===m[0]?"on":""}">${m[1]}</button>`).join("")+
    `<div class="mh">${t.style}</div>`+
    [["flow",t.sFlow],["wheel",t.sWheel],["deck",t.sDeck]].map(m=>`<button data-s="${m[0]}" class="${style3d===m[0]?"on":""}">${m[1]}</button>`).join("");
}
function paintAuto(){
  const t=T();
  autoBtn.classList.toggle("off",!autoOnNow());
  autoBtn.querySelector("span").textContent=motion==="auto"?t.auto:(motion==="drift"?t.mDrift:t.autoOff);
  syncRail();
}
function pauseAuto(){lastUser=Date.now();syncRail();}
function syncRail(){
  const holding=Date.now()-lastUser<12000;
  rail.classList.toggle("off",!autoOnNow());
  rail.classList.toggle("slow",motion==="drift");
  rail.classList.toggle("paused",!autoOnNow()||holding||storyVisible||document.hidden);
}
function startAuto(){
  clearInterval(autoTimer);
  if(!autoOnNow())return;
  autoTimer=setInterval(tickAuto,SPEED[motion]);
}
autoBtn.addEventListener("click",e=>{e.stopPropagation();
  const open=mwrap.dataset.open==="true"; buildMopts();
  mwrap.dataset.open=String(!open); autoBtn.setAttribute("aria-expanded",String(!open));});
mopts.addEventListener("click",e=>{
  e.stopPropagation();
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.m){motion=b.dataset.m;try{localStorage.setItem("exz-motion",motion);}catch(err){}startAuto();}
  if(b.dataset.s){style3d=b.dataset.s;try{localStorage.setItem("exz-style",style3d);}catch(err){}place();}
  mopts.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x.dataset.m===motion));
  mopts.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x.dataset.s===style3d));
  paintAuto();
});
document.addEventListener("click",e=>{if(!e.target.closest("#motionwrap")){mwrap.dataset.open="false";autoBtn.setAttribute("aria-expanded","false");}});
function tickAuto(){
  if(!autoOnNow())return;
  if(Date.now()-lastUser<12000){syncRail();return;}
  if(storyVisible||document.hidden){syncRail();return;}
  let n=active+dir;
  if(n>=PETALS.length){dir=-1;n=active-1;}
  if(n<0){dir=1;n=active+1;}
  active=n; place();
}
setInterval(syncRail,1000);
new IntersectionObserver(es=>es.forEach(x=>{storyVisible=x.isIntersecting;syncRail();}),{threshold:.25})
  .observe(document.getElementById("story"));

addEventListener("keydown",e=>{

  if(!reduced)bigstar.style.transform=`translate(-50%,-50%) translateY(${scrollY*.06}px)`;
},{passive:true});
let io=null;
function hookReveals(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);}}),{threshold:.15});
  document.querySelectorAll(".rev:not(.in)").forEach(el=>io.observe(el));
}

/* ============ theme + language ============ */
const uTheme=document.getElementById("uTheme");
function applyTheme(){
  document.documentElement.dataset.theme=theme;
  uTheme.innerHTML=(theme==="dark"?"\u263D":"\u2600")+`<span class="lbl">${theme==="dark"?(lang==="de"?"Hell":"Light"):(lang==="de"?"Dunkel":"Dark")}</span>`;
  uTheme.setAttribute("aria-label",theme==="dark"?"Switch to light mode":"Switch to dark mode");
}
uTheme.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";applyTheme();});
if(matchMedia("(prefers-color-scheme: light)").matches){theme="light";}
applyTheme();

const uLang=document.getElementById("uLang");
function applyLang(){
  document.documentElement.lang=lang;
  uLang.innerHTML=`<span>${lang.toUpperCase()}</span>`;
  uLang.setAttribute("aria-label",lang==="en"?"Sprache: Deutsch":"Language: English");
  document.querySelectorAll("[data-i18n]").forEach(n=>{const k=n.dataset.i18n;if(T()[k]!==undefined)n.textContent=T()[k];});
  cards.forEach((c,i)=>{
    c.querySelector("h2").textContent=PETALS[i].n[lang];
    c.querySelector(".ident").textContent=PETALS[i].ident[lang];
    c.querySelector(".goT").textContent=T().doors[doorOf(PETALS[i].key).k];
    c.querySelector(".cstT").textContent=stFull(PETALS[i].key);
    c.querySelector(".pnT").textContent=T().point+" "+String(i+1).padStart(2,"0")+" / 12";
    c.querySelector(".capT").textContent=PETALS[i].n[lang];
    c.querySelectorAll(".ctT").forEach(t=>{const k=t.dataset.k;if(SLAB[k])t.textContent=SLAB[k][lang];});
  });
  railBtns.forEach((b,i)=>{b.querySelector(".r9t").textContent=PETALS[i].n[lang];
    b.querySelector(".r9s").textContent=stTag(PETALS[i].key);});
  buildMopts(); ptPaint(); if(ptmodal.dataset.open==="true")buildPtBody();
  paintAuto(); applyTheme(); place();
}
uLang.addEventListener("click",()=>{lang=lang==="en"?"de":"en";applyLang();});

/* ============ Petal Points ============ */
const PTK={n:"exz-points",log:"exz-pts-log",day:"exz-pts-day"};
const ptmodal=document.getElementById("ptmodal");
function ptGet(){try{return +(localStorage.getItem(PTK.n)||0)||0;}catch(e){return 0;}}
function ptLog(){try{return JSON.parse(localStorage.getItem(PTK.log)||"[]");}catch(e){return [];}}
function ptSave(n,log){try{localStorage.setItem(PTK.n,String(n));localStorage.setItem(PTK.log,JSON.stringify(log));}catch(e){}}
function ptPaint(){const b=document.querySelector("#ptsBtn b");if(b)b.textContent=ptGet();}
let toastT=null;
function ptToast(n,msg){
  const el=document.getElementById("ptoast");
  document.getElementById("ptoastN").textContent="+"+n;
  document.getElementById("ptoastT").textContent=msg;
  el.classList.add("on"); clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove("on"),3800);
  const chip=document.getElementById("ptsBtn");
  if(chip){chip.classList.remove("pop");void chip.offsetWidth;chip.classList.add("pop");}
}
function ptAward(id,n,msg){
  const log=ptLog(); if(log.indexOf(id)>-1)return false;
  log.push(id); ptSave(ptGet()+n,log); ptPaint(); ptToast(n,msg); return true;
}
function ptCheckin(){
  const today=new Date().toISOString().slice(0,10);
  let last=null; try{last=localStorage.getItem(PTK.day);}catch(e){}
  if(last===today)return;
  try{localStorage.setItem(PTK.day,today);}catch(e){}
  ptSave(ptGet()+10,ptLog()); ptPaint(); ptToast(10,T().pt.checkin);
}
let dwellT=null;
function dwell(){
  clearTimeout(dwellT);
  const k=PETALS[active].key, nm=PETALS[active].n[lang];
  dwellT=setTimeout(()=>{
    if(ptAward("petal:"+k,5,T().pt.petal.replace("{n}",nm))){
      const seen=ptLog().filter(x=>x.indexOf("petal:")===0).length;
      if(seen>=PETALS.length)setTimeout(()=>ptAward("bloom",50,T().pt.bloom),1400);
    }
  },2600);
}
function buildPtBody(){
  const t=T().pt, log=ptLog(), seen=log.filter(x=>x.indexOf("petal:")===0).length;
  document.getElementById("ptBody").innerHTML=`
    <h3>${t.title}</h3>
    <p>${t.lead}</p>
    <div class="ptrow"><b>+20</b>${t.r1}</div>
    <div class="ptrow"><b>+10</b>${t.r2}</div>
    <div class="ptrow"><b>+5</b>${t.r3} <span style="margin-left:auto;color:var(--dim)">${seen} / 12</span></div>
    <div class="ptrow"><b>+50</b>${t.r4}</div>
    <p style="margin-top:16px">${t.use}</p>
    <div class="ptnote">${t.note}</div>
    <div class="ptactions">
      <a class="go" style="--c:var(--acc)" href="/signup"><span>${t.signup}</span><span class="ar">\u2192</span></a>
      <span class="story-link" style="pointer-events:none">${t.have} <b style="color:var(--goldT);margin-left:6px">${ptGet()}</b></span>
    </div>`;
}
function ptOpen(){buildPtBody();ptmodal.dataset.open="true";}
function ptClose(){ptmodal.dataset.open="false";}
document.getElementById("ptsBtn").addEventListener("click",ptOpen);
document.getElementById("ptsLink").addEventListener("click",ptOpen);
document.getElementById("ptClose").addEventListener("click",ptClose);
ptmodal.addEventListener("click",e=>{if(e.target===ptmodal)ptClose();});
addEventListener("keydown",e=>{if(e.key==="Escape")ptClose();});
function ptBoot(){
  ptPaint();
  setTimeout(()=>{ if(!ptAward("welcome",20,T().pt.welcome)) ptCheckin(); else setTimeout(ptCheckin,4200); },900);
}

mqM.addEventListener&&mqM.addEventListener("change",()=>place());
buildMopts(); paintAuto(); startAuto(); place(); hookReveals(); ptBoot();
</script>
