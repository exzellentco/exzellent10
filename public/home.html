<!DOCTYPE html>
<!-- ============================================================
     EXZELLENT — Website · Development 10 · 2026-08-05
     Fresh build: design polish + new sections
     Single-file: all CSS/JS inline. No external dependencies
     except Google Fonts (degrades gracefully offline).
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXZELLENT — Master. Build. Ace.</title>
<meta name="description" content="EXZELLENT builds AI-driven products and digital experiences — home of Exzi, our AI Companion. Master. Build. Ace.">
<meta property="og:title" content="EXZELLENT — Master. Build. Ace.">
<meta property="og:description" content="AI-driven products and digital experiences. Home of Exzi, our AI Companion.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060b;
  --bg-2:#0a0c14;
  --surface:#0f1220;
  --surface-2:#141830;
  --line:rgba(148,163,215,.14);
  --text:#eef1fb;
  --muted:#9aa3c2;
  --violet:#8a4bf5;
  --cyan:#c9aaff;
  --grad:linear-gradient(100deg,var(--violet),var(--cyan));
  --radius:18px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --logo-url:url("logo.png");
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.65;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(138,75,245,.45)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.12;letter-spacing:-.02em}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{width:min(1160px,92%);margin-inline:auto}
section{position:relative;padding:104px 0}

/* ---------- helpers ---------- */
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:18px;
}
.eyebrow::before{content:"";width:26px;height:1.5px;background:var(--grad);border-radius:2px}
.h2{font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:700;margin-bottom:16px}
.lead{color:var(--muted);max-width:640px;font-size:1.06rem}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

/* ---------- nav ---------- */
.nav{
  position:fixed;inset:0 0 auto 0;z-index:50;
  transition:background .3s ease,border-color .3s ease;
  border-bottom:1px solid transparent;
}
.nav.scrolled{background:rgba(5,6,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.nav-inner{
  width:min(1240px,94%);margin-inline:auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;gap:24px;
}
.nav-links{display:flex;gap:30px;list-style:none}
.nav-links a{font-size:.92rem;font-weight:500;color:var(--muted);transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.06em}
.burger{display:none;background:none;border:0;width:40px;height:40px;position:relative;z-index:60}
.burger span{display:block;width:22px;height:2px;background:var(--text);margin:5px auto;border-radius:2px;transition:transform .3s,opacity .3s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:14px 26px;border-radius:14px;font-weight:600;font-size:.95rem;
  border:1px solid transparent;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;
}
.btn-primary{background:var(--grad);color:#04060d;box-shadow:0 8px 30px rgba(138,75,245,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(138,75,245,.5)}
.btn-ghost{border-color:var(--line);color:var(--text);background:rgba(255,255,255,.02)}
.btn-ghost:hover{border-color:rgba(138,75,245,.6);transform:translateY(-2px)}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ---------- hero ---------- */
.hero{
  min-height:100svh;display:flex;align-items:center;
  padding:124px 0 70px;overflow:hidden;
}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.hero-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(148,163,215,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,215,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 75% 60% at 50% 40%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 75% 60% at 50% 40%,#000 30%,transparent 75%);
}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 12s ease-in-out infinite}
.orb-1{width:480px;height:480px;background:rgba(138,75,245,.35);top:-140px;left:-120px}
.orb-2{width:420px;height:420px;background:rgba(6,182,212,.14);bottom:-120px;right:-80px;animation-delay:-6s}
.orb-3{width:340px;height:340px;background:rgba(236,72,153,.10);top:16%;right:14%;animation-delay:-3s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-26px)}}
.hero-inner{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid var(--line);background:rgba(15,18,32,.6);
  padding:7px 15px;border-radius:99px;font-size:.8rem;color:var(--muted);margin-bottom:26px;
}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.hero h1{font-size:clamp(2.5rem,5.2vw,4.2rem);font-weight:700;margin-bottom:16px}
.hero h1 .line{display:block}
.hero p.lead{margin-bottom:26px}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}
.hero-props{display:flex;gap:26px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.hero-props span{display:flex;align-items:center;gap:8px}
.hero-props b{color:var(--text);font-family:var(--font-display)}

/* Exzi chat card in hero */
.chat-card{
  background:linear-gradient(160deg,rgba(20,24,48,.9),rgba(10,12,20,.9));
  border:1px solid var(--line);border-radius:22px;padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  position:relative;
}
.chat-card::before{
  content:"";position:absolute;inset:-1px;border-radius:23px;padding:1px;
  background:linear-gradient(140deg,rgba(138,75,245,.55),transparent 38%,transparent 62%,rgba(201,170,255,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.chat-head{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.chat-avatar{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#04060d}
.chat-head .name{font-family:var(--font-display);font-weight:600;font-size:.98rem}
.chat-head .st{font-size:.76rem;color:var(--cyan);display:flex;align-items:center;gap:6px}
.chat-head .st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.msg{max-width:86%;padding:11px 15px;border-radius:14px;font-size:.87rem;margin-bottom:11px;opacity:0;transform:translateY(8px);animation:msgIn .45s ease forwards}
.msg.bot{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.user{background:linear-gradient(120deg,rgba(138,75,245,.28),rgba(201,170,255,.2));border:1px solid rgba(138,75,245,.35);margin-left:auto;border-bottom-right-radius:5px}
.msg:nth-of-type(1){animation-delay:.5s}
.msg:nth-of-type(2){animation-delay:1.3s}
.msg:nth-of-type(3){animation-delay:2.1s}
@keyframes msgIn{to{opacity:1;transform:none}}
.typing{display:inline-flex;gap:4px;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:5px;opacity:0;animation:msgIn .4s ease 2.9s forwards}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{30%{transform:translateY(-5px)}}

/* ---------- pillars (Master/Build/Ace) ---------- */
.pillars{padding-top:0}
.pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:34px 30px;transition:transform .3s,border-color .3s,box-shadow .3s;position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-5px);border-color:rgba(138,75,245,.45);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.card .num{font-family:var(--font-display);font-size:.8rem;color:var(--cyan);letter-spacing:.16em;margin-bottom:16px;display:block}
.card h3{font-size:1.35rem;margin-bottom:11px}
.card p{color:var(--muted);font-size:.94rem}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.card:hover::after{transform:scaleX(1)}

/* ---------- exzi ---------- */
.exzi{background:var(--bg-2);border-block:1px solid var(--line)}
.exzi-inner{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.feature-list{list-style:none;margin-top:28px;display:grid;gap:16px}
.feature-list li{display:flex;gap:14px;align-items:flex-start}
.f-ico{
  flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(138,75,245,.14);border:1px solid rgba(138,75,245,.3);font-size:1rem;
}
.feature-list b{display:block;font-family:var(--font-display);font-weight:600;font-size:.98rem}
.feature-list span{color:var(--muted);font-size:.9rem}
.exzi-visual{position:relative}
.exzi-orbit{
  aspect-ratio:1;max-width:430px;margin-inline:auto;border-radius:50%;
  border:1px dashed rgba(148,163,215,.22);display:grid;place-items:center;position:relative;
  animation:none;
}
.exzi-core{
  width:56%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(138,75,245,.85),rgba(15,18,32,.95) 65%);
  border:1px solid rgba(138,75,245,.5);display:grid;place-items:center;
  box-shadow:0 0 90px rgba(138,75,245,.4),inset 0 0 60px rgba(201,170,255,.15);
}
.exzi-core span{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:.04em}
.sat{
  position:absolute;padding:9px 15px;border-radius:99px;font-size:.78rem;font-weight:600;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);
  animation:float 9s ease-in-out infinite;white-space:nowrap;
}
.sat-1{top:4%;left:6%}
.sat-2{top:38%;right:-4%;animation-delay:-3s}
.sat-3{bottom:6%;left:14%;animation-delay:-6s}

/* ---------- services ---------- */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px}
.svc .ico{
  width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;
  background:linear-gradient(140deg,rgba(138,75,245,.2),rgba(201,170,255,.12));
  border:1px solid rgba(138,75,245,.3);margin-bottom:20px;
}
.svc ul{list-style:none;margin-top:16px;display:grid;gap:8px}
.svc ul li{color:var(--muted);font-size:.88rem;display:flex;gap:9px;align-items:baseline}
.svc ul li::before{content:"→";color:var(--cyan);font-size:.8rem}

/* ---------- process ---------- */
.process{background:var(--bg-2);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;counter-reset:step}
.step{position:relative;padding:0 26px 0 0}
.step::before{
  counter-increment:step;content:"0" counter(step);
  font-family:var(--font-display);font-weight:700;font-size:2.4rem;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  display:block;margin-bottom:14px;
}
.step::after{content:"";position:absolute;top:22px;right:26px;left:72px;height:1px;background:linear-gradient(90deg,rgba(138,75,245,.5),rgba(148,163,215,.12))}
.step:last-child::after{display:none}
.step h3{font-size:1.08rem;margin-bottom:8px}
.step p{color:var(--muted);font-size:.88rem}

/* ---------- values ---------- */
.values-inner{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start}
.values-sticky{position:sticky;top:120px}
.value-row{
  display:flex;gap:22px;padding:26px 0;border-bottom:1px solid var(--line);align-items:flex-start;
}
.value-row:first-child{padding-top:0}
.value-row .v-num{font-family:var(--font-display);color:var(--cyan);font-size:.85rem;padding-top:4px;letter-spacing:.1em}
.value-row h3{font-size:1.2rem;margin-bottom:7px}
.value-row p{color:var(--muted);font-size:.92rem}

/* ---------- cta band + contact ---------- */
.cta-band{padding:0}
.cta-box{
  background:linear-gradient(130deg,rgba(138,75,245,.16),rgba(201,170,255,.09)),var(--surface);
  border:1px solid rgba(138,75,245,.35);border-radius:26px;
  padding:70px 56px;text-align:center;position:relative;overflow:hidden;
}
.cta-box::before{
  content:"";position:absolute;width:400px;height:400px;border-radius:50%;
  background:rgba(138,75,245,.22);filter:blur(100px);top:-200px;left:50%;transform:translateX(-50%);
}
.cta-box h2{font-size:clamp(1.8rem,3.4vw,2.6rem);margin-bottom:14px;position:relative}
.cta-box p{color:var(--muted);max-width:520px;margin:0 auto 34px;position:relative}
.cta-box .btn{position:relative}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:56px 0 34px;background:var(--bg-2)}
.foot-grid{display:flex;justify-content:space-between;gap:44px;flex-wrap:wrap;margin-bottom:44px}
.foot-brand p{color:var(--muted);font-size:.9rem;max-width:300px;margin-top:14px}
.foot-col h4{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.foot-col ul{list-style:none;display:grid;gap:10px}
.foot-col a{color:var(--muted);font-size:.9rem;transition:color .2s}
.foot-col a:hover{color:var(--text)}
.foot-base{
  border-top:1px solid var(--line);padding-top:26px;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  color:var(--muted);font-size:.82rem;
}

/* ---------- entry stage: the shiny logo star ---------- */
.entry-wrap{display:flex;flex-direction:column;align-items:center}
.entry-stage{position:relative;width:min(86vw,680px);margin:34px auto 112px}
.star-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(138,75,245,.32),rgba(138,75,245,.06) 60%,transparent 72%);filter:blur(46px);pointer-events:none;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)}}
.logo-star{
  position:relative;width:100%;aspect-ratio:880/582;
  background:var(--logo-url) center/contain no-repeat;
  filter:drop-shadow(0 0 26px rgba(138,75,245,.55)) drop-shadow(0 0 70px rgba(138,75,245,.28));
}
.logo-shine{
  position:absolute;inset:0;
  -webkit-mask:var(--logo-url) center/contain no-repeat;
  mask:var(--logo-url) center/contain no-repeat;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 46%,rgba(201,170,255,.55) 50%,rgba(255,255,255,.5) 54%,transparent 68%);
  background-size:260% 100%;background-repeat:no-repeat;
  animation:shine 5.2s ease-in-out infinite;
}
@keyframes shine{0%,18%{background-position:130% 0}62%,100%{background-position:-130% 0}}
/* labels on the points of the logo */
.star-label{
  position:absolute;z-index:3;
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(.72rem,1.5vw,.98rem);letter-spacing:.16em;text-transform:uppercase;
  color:#c3c9e4;white-space:nowrap;
  text-shadow:0 2px 14px rgba(5,6,11,.9);
  transition:color .25s,text-shadow .25s;
}
.star-label::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-7px;width:0;height:1.5px;background:var(--pc);transition:width .3s;border-radius:2px}
.star-label{--pc:#c9aaff}
.star-label:hover,.star-label:focus-visible{color:#ffffff;text-shadow:0 0 20px var(--pc)}
.star-label:hover::after,.star-label:focus-visible::after{width:100%}
.star-label.main{color:#e7ddff}
.star-label.soon{opacity:.38;pointer-events:none}
.lbl-companion{--pc:#a78bfa;left:50%;top:0;transform:translate(-50%,-135%);animation-delay:.55s}
.lbl-learning{--pc:#67e8f9;left:78%;top:-2%;transform:translate(-34%,-116%);animation-delay:.68s;line-height:1.26;text-align:center}
.lbl-expats{--pc:#f472b6;left:101.5%;top:33%;transform:translate(0,-50%);animation-delay:.81s}
.lbl-services{--pc:#2dd4bf;left:96%;top:71%;transform:translate(2%,-50%);animation-delay:.94s}
.lbl-funding{--pc:#fbbf24;line-height:1.26;text-align:center;left:70%;top:101%;transform:translate(-25%,50%);animation-delay:1.07s}
.lbl-aitools{--pc:#38bdf8;left:24%;top:-2%;transform:translate(-60%,-135%);animation-delay:1.2s}
.lbl-marketing{--pc:#e879f9;left:-1.5%;top:33%;transform:translate(-100%,-50%);animation-delay:1.33s}
.lbl-business{--pc:#34d399;left:4%;top:71%;transform:translate(-102%,-50%);animation-delay:1.46s}
.lbl-others{--pc:#fb923c;left:30%;top:101%;transform:translate(-75%,50%);animation-delay:1.59s}
.star-label{animation:lblIn .6s ease both}
@keyframes lblIn{from{opacity:0}}
/* draw the eye to the Learning Ecosystem — the intended next step after landing */
.lbl-learning{animation:lblIn .6s ease .68s both, learnGlow 2.6s ease-in-out 1.4s infinite}
.lbl-learning::before{
  content:"✦ Start here";position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);
  white-space:nowrap;font-size:.6rem;font-weight:800;letter-spacing:.09em;
  color:#04121a;background:linear-gradient(120deg,#67e8f9,#a78bfa);
  padding:3px 10px;border-radius:999px;box-shadow:0 0 16px rgba(103,232,249,.55);
  animation:startHereBob 1.9s ease-in-out infinite;pointer-events:none;
}
@keyframes learnGlow{0%,100%{text-shadow:0 0 15px rgba(103,232,249,.4)}50%{text-shadow:0 0 28px rgba(103,232,249,.9)}}
@keyframes startHereBob{0%,100%{transform:translateX(-50%) translateY(0);box-shadow:0 0 14px rgba(103,232,249,.45)}50%{transform:translateX(-50%) translateY(3px);box-shadow:0 0 24px rgba(103,232,249,.85)}}
@media (prefers-reduced-motion:reduce){.lbl-learning,.lbl-learning::before{animation:none}}
/* scroll hint */
.scroll-hint{
  display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px;
  color:var(--muted);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
  transition:color .25s;
}
.scroll-hint:hover{color:var(--text)}
.chev-down{font-size:1rem;animation:drop 1.8s ease-in-out infinite}
@keyframes drop{50%{transform:translateY(6px);opacity:.5}}
/* point popups — open toward their side of the screen */
.point-pop{
  position:absolute;z-index:6;text-align:left;
  border:1px solid transparent;border-radius:14px;
  background:linear-gradient(165deg,rgba(19,22,42,.97),rgba(9,10,20,.97)) padding-box,
             linear-gradient(140deg,rgba(138,75,245,.9),rgba(201,170,255,.25) 45%,rgba(138,75,245,.7)) border-box;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  padding:20px 24px;box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 46px rgba(138,75,245,.26);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

l172 625 59 7 c33 3 233 36 445 72 211 36 551 93 754 126 1249 204 1100 177 1083 197 -7 9 -56 50 -108 92 -177 141 -1133 946 -1169 985 -22 23 -23 28 -10 40 17 15 1043 813 1334 1036 206 158 255 198 255 211 0 11 -74 25 -384 75 -325 52 -581 94 -976 163 -446 77 -935 164 -937 165 -1 1 -11 42 -22 91 -11 50 -41 180 -66 290 -25 110 -79 349 -120 530 -41 182 -99 434 -129 560 -30 127 -60 258 -66 293 -7 34 -15 62 -19 61 -3 0 -87 -50 -186 -110z m1267 -3736 c161 -124 393 -302 514 -395 122 -92 227 -175 233 -182 14 -17 38 -11 -454 -110 -176 -36 -572 -117 -880 -181 -308 -64 -575 -119 -593 -122 -18 -3 -39 -15 -47 -27 -7 -12 -84 -277 -170 -591 -87 -314 -162 -581 -167 -594 -8 -22 -13 -17 -61 65 -164 275 -537 906 -560 945 l-26 46 122 89 c67 48 212 154 322 234 110 80 263 190 340 245 77 54 239 171 360 260 175 128 576 420 725 526 14 10 30 19 37 19 6 0 143 -102 305 -227z m-6361 109 c85 -59 510 -357 944 -661 435 -305 805 -565 823 -578 l33 -25 -27 -46 c-100 -170 -653 -1027 -659 -1020 -2 1 -76 273 -164 603 -89 330 -165 609 -170 621 -11 24 -27 28 -411 84 -151 22 -439 64 -640 95 -201 30 -496 74 -657 97 -250 36 -290 44 -280 57 15 18 173 153 602 516 182 153 352 298 379 322 26 24 54 43 61 43 6 0 81 -49 166 -108z";
  var LOGO_INNER="M4982 5846 c-11 -24 -216 -285 -311 -396 -480 -558 -980 -1023 -1590 -1479 -87 -65 -172 -127 -190 -137 -17 -10 -31 -24 -31 -31 0 -7 69 -95 153 -195 180 -215 556 -671 670 -813 45 -55 108 -131 142 -170 63 -73 270 -324 411 -499 45 -56 97 -119 116 -140 l34 -39 63 244 c34 134 129 510 211 834 82 325 193 768 248 985 55 217 103 409 107 425 8 29 8 29 21 -20 28 -100 194 -752 533 -2095 44 -173 82 -327 85 -342 8 -38 27 -28 71 39 21 31 103 144 184 252 80 108 176 237 212 286 147 200 391 531 667 902 160 216 296 401 301 412 10 17 -11 34 -192 159 -457 317 -596 424 -892 688 -393 351 -681 673 -907 1015 -50 76 -94 139 -98 139 -4 0 -12 -11 -18 -24z";
  /* nav background on scroll */
  var nav=document.getElementById('nav');
  var onScroll=function(){nav.classList.toggle('scrolled',window.scrollY>24);};
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  /* ===== entrance animation — a different one on every visit ===== */
  var stage=document.querySelector('.entry-stage');
  var VARIANTS=['v-bloom','v-bloom','v-bloom','v-shine','v-pulse','v-edges','v-build','v-rise','v-constellation'];
  var variant=VARIANTS[Math.floor(Math.random()*VARIANTS.length)];
  if(stage){stage.classList.add(variant);}
  /* lotus bloom: slice the logo into 8 petal wedges that unfold from the bud */
  if(variant==='v-bloom'){
    var star=document.querySelector('.logo-star');
    if(star){
      var ORDER=[0,3,6,1,4,7,2,5]; /* spiral unfold */
      for(var w=0;w<8;w++){
        var a1=w*45-22.5,am=w*45,a2=w*45+22.5,R=125;
        function ptx(a){return (50+R*Math.sin(a*Math.PI/180)).toFixed(1)+'% '+(50-R*Math.cos(a*Math.PI/180)).toFixed(1)+'%';}
        var d=document.createElement('div');
        d.className='bloom-petal';
        d.style.clipPath='polygon(50% 50%, '+ptx(a1)+', '+ptx(am)+', '+ptx(a2)+')';
        d.style.animationDelay=(0.12+ORDER.indexOf(w)*0.1)+'s';
        star.insertBefore(d,star.firstChild);
      }
    }
  }
  var cons=document.getElementById('constellation');
  if(cons&&variant==='v-constellation'){
    var NSVG='http://www.w3.org/2000/svg';
    var ring=[[50,3],[25,6],[3,33],[28,96],[50,93],[72,96],[97,33],[75,6],[50,3]];
    var d1='M'+ring.map(function(pt){return pt[0]+','+pt[1];}).join(' L');
    var d2=ring.slice(0,8).map(function(pt){return 'M50,50 L'+pt[0]+','+pt[1];}).join(' ');
    var p1=document.createElementNS(NSVG,'path');p1.setAttribute('d',d1);
    var p2=document.createElementNS(NSVG,'path');p2.setAttribute('d',d2);p2.setAttribute('class','spokes');
    cons.appendChild(p2);cons.appendChild(p1);
    ring.slice(0,8).forEach(function(pt){
      var c=document.createElementNS(NSVG,'circle');
      c.setAttribute('cx',pt[0]);c.setAttribute('cy',pt[1]);c.setAttribute('r','0.8');
      cons.appendChild(c);
    });
  }

  /* ===== the nine points — one source of truth ===== */
  /* videos: set src to an .mp4 URL or a YouTube embed URL and it plays in place. */
  var POINTS=[
    {key:'learning',col:'#67e8f9',num:'01',side:'top',page:'learning-ecosystem.html',title:'Learning Ecosystem',tag:'Three labs, real tutors, one companion.',
     desc:'The Language Lab, Skill Lab and Growth Lab — with real tutors you can book, an AI companion, a free community hub and your own dashboard. For students, teachers and universities alike.',
     items:['Language Lab','Skill Lab','Growth Lab','Book real tutors','Free community guides','Students · Teachers · Universities'],
     videos:[{t:'A week in the ecosystem',d:'1:12'},{t:'Inside the three labs',d:'1:16'},{t:'Booking a tutor',d:'0:54'},{t:'For universities',d:'1:02'}]},
    {key:'companion',col:'#a78bfa',num:'02',side:'top',page:'/exzi',title:'AI Companion — Exzi',tag:'Your companion for getting things done excellently.',
     desc:'Exzi plans with you, remembers your context, and follows through until things are actually done. Not another chat window — a companion that works alongside you, private by design.',
     items:['Plans your day & follows through','Keeps context like a teammate','Private — answers only to you'],
     videos:[{t:'Meet Exzi in 60 seconds',d:'0:58'},{t:'Planning a week with Exzi',d:'1:24'},{t:'Private by design',d:'0:47'}]},
    {key:'aitools',col:'#38bdf8',num:'03',side:'top',page:'ai-tools.html',title:'AI Tools',tag:'The intelligence behind every branch.',
     desc:'Our AI lab and toolkit — the models, integrations and experiments that power Exzi and everything else we build. What we learn here, you feel everywhere.',
     items:['AI products & experiments','Models & integrations','Powers Exzi and beyond'],
     videos:[{t:'Inside our AI lab',d:'1:18'},{t:'Models & integrations',d:'1:00'},{t:'Powering Exzi',d:'0:52'}]},
    {key:'expats',col:'#f472b6',num:'04',side:'right',page:'expats.html',title:'Expats & Career',tag:'Land, settle, and build a career abroad.',
     desc:'Free country guides for arriving in Germany and beyond — visas, Anmeldung, housing, taxes — plus CVs, job search and career coaching once you are here.',
     items:['Country & relocation guides','Visas, housing, Anmeldung','CVs & job search','Career coaching'],
     videos:[{t:'Moving to Germany',d:'1:30'},{t:'The German-style CV',d:'1:04'},{t:'Finding work as an expat',d:'1:12'}]},
    {key:'business',col:'#34d399',num:'05',side:'left',page:'business.html',title:'Business',tag:'Keeping the vessel on course.',
     desc:'B2B development, partnerships and operations — the discipline that keeps every branch growing from one vessel without losing the standard.',
     items:['B2B development','Partnerships','Operations'],
     videos:[{t:'Partnering with EXZELLENT',d:'1:03'},{t:'B2B solutions',d:'0:57'},{t:'How we operate',d:'0:48'}]},
    {key:'marketing',col:'#e879f9',num:'06',side:'left',page:'marketing.html',title:'Marketing',tag:'Attention into momentum.',
     desc:'Positioning, campaigns and analytics that compound — the branch that turns being seen into being chosen.',
     items:['Brand & positioning','Campaigns & growth','Analytics & iteration'],
     videos:[{t:'Campaigns that compound',d:'1:07'},{t:'Positioning workshop',d:'0:59'},{t:'The content engine',d:'1:14'}]},
    {key:'services',col:'#2dd4bf',num:'07',side:'right',page:'tools-services.html',title:'Tools & Services',tag:'Everything we build, in one place.',
     desc:'The full catalogue of what EXZELLENT builds and runs — websites, business plans, marketing and finance plans — from idea to shipped.',
     items:['All services in one','Built and run for you','From idea to shipped'],
     videos:[{t:'What we build',d:'1:10'},{t:'From idea to shipped',d:'1:21'},{t:'Working with us',d:'0:56'}]},
    {key:'funding',col:'#fbbf24',num:'08',side:'bottom',page:'entrepreneurship.html',title:'Funding & Investment',tag:'The capital behind the growth.',
     desc:'Investment, crowdfunding and investor relations — how EXZELLENT is funded, and how partners and backers get involved.',
     items:['Investment','Crowdfunding','Investor relations','The deck & data room'],
     videos:[{t:'Why EXZELLENT',d:'1:22'},{t:'Investment & crowdfunding',d:'1:09'},{t:'For partners',d:'0:51'}]},
    {key:'others',col:'#fb923c',num:'09',side:'bottom',page:'community.html',title:'Others',tag:'The vessel keeps growing.',
     desc:'The ventures still taking shape inside EXZELLENT. The ninth point stays open on purpose — new branches join the star as they mature.',
     items:['New ventures incubating','Announced when ready'],
     videos:[{t:'What is next',d:'0:45'},{t:'New ventures',d:'0:53'}]}
  ];
  var byKey={};POINTS.forEach(function(pt){byKey[pt.key]=pt;});

  /* ===== hover popups on the star ===== */
  var SLOTS={top:document.getElementById('popTop'),left:document.getElementById('popLeft'),
             right:document.getElementById('popRight'),bottom:document.getElementById('popBottom')};
  var hideTimer=null,shownKey=null,pinned=false;
  function hidePops(){for(var k in SLOTS){if(SLOTS[k]){SLOTS[k].classList.remove('show');}}shownKey=null;pinned=false;}
  function showPop(key){
    var d=byKey[key];if(!d){return;}
    clearTimeout(hideTimer);pinned=false;hidePops();
    var slot=SLOTS[d.side];if(!slot){return;}
    slot.style.setProperty('--pc',d.col||'#c9aaff');
    slot.innerHTML='<span class="pp-num">POINT '+d.num+' / 09</span><h4>'+d.title+'</h4><p class="pp-tag">'+d.tag+'</p><ul>'+
      d.items.map(function(x){return '<li>'+x+'</li>';}).join('')+
      (d.page?'</ul><a class="pp-open" href="'+d.page+'">Open '+d.title+' →</a>':'</ul><span class="pp-soon">Page coming soon</span>');
    slot.classList.add('show');shownKey=key;
  }
  function scheduleHide(){if(pinned)return;clearTimeout(hideTimer);hideTimer=setTimeout(hidePops,180);}
  document.querySelectorAll('.star-label[data-point]').forEach(function(el){
    var key=el.getAttribute('data-point');
    el.addEventListener('mouseenter',function(){showPop(key);});
    el.addEventListener('focus',function(){showPop(key);});
    el.addEventListener('mouseleave',scheduleHide);
    el.addEventListener('blur',scheduleHide);
    el.addEventListener('click',function(e){if(!byKey[key].page){e.preventDefault();showPop(key);pinned=true;}});
    el.addEventListener('touchstart',function(e){
      if(shownKey!==key){e.preventDefault();showPop(key);}
    },{passive:false});
  });
  for(var sk in SLOTS){
    if(SLOTS[sk]){
      SLOTS[sk].addEventListener('mouseenter',function(){clearTimeout(hideTimer);});
      SLOTS[sk].addEventListener('mouseleave',scheduleHide);
    }
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){hidePops();}});

  /* ===== explorer: one panel, one player, chips swap the video ===== */
  var rail=document.getElementById('exRail');
  var exNum=document.getElementById('exNum'),exTitle=document.getElementById('exTitle'),
      exDesc=document.getElementById('exDesc'),exItems=document.getElementById('exItems');
  var pTitle=document.getElementById('pTitle'),pDur=document.getElementById('pDur'),
      pNote=document.getElementById('pNote'),frame=document.getElementById('playerFrame'),
      chips=document.getElementById('vidChips');
  var current='companion',vidIdx=0,noteTimer=null,railBtns={};
  function renderVideo(){
    var pt=byKey[current],v=pt.videos[vidIdx];
    pTitle.textContent=v.t;pDur.textContent=v.d;
    Array.prototype.forEach.call(chips.children,function(c,i){c.classList.toggle('act',i===vidIdx);});
    var old=frame.querySelector('video,iframe');if(old){old.remove();}
    pNote.classList.remove('on');
  }
  function selectVideo(i){
    var n=byKey[current].videos.length;
    vidIdx=((i%n)+n)%n;
    renderVideo();
  }
  function selectPoint(key){
    if(!byKey[key]){return;}
    current=key;vidIdx=0;
    var pt=byKey[key];
    var pg=document.getElementById('exPage');
    if(pg){if(pt.page){pg.href=pt.page;pg.style.display='inline-flex';pg.lastChild&&(pg.firstChild.textContent='Open the full '+pt.title+' page ');}else{pg.style.display='none';}}
    exNum.style.setProperty('--pc',pt.col||'#c9aaff');
    exNum.textContent='POINT '+pt.num+' / 09';
    exTitle.textContent=pt.title;
    exDesc.textContent=pt.desc;
    exItems.innerHTML=pt.items.map(function(x){return '<li>'+x+'</li>';}).join('');
    chips.innerHTML=pt.videos.map(function(v,i){return '<button class="vid-chip'+(i===0?' act':'')+'" type="button">'+v.t+'</button>';}).join('');
    Array.prototype.forEach.call(chips.children,function(c,i){
      c.addEventListener('click',function(){selectVideo(i);});
    });
    for(var k in railBtns){railBtns[k].classList.toggle('act',k===key);}
    renderVideo();
  }
  window.selectPoint=selectPoint;
  if(rail){
    POINTS.forEach(function(pt){
      var b=document.createElement('button');
      b.type='button';
      b.innerHTML='<span class="n">'+pt.num+'</span><span>'+pt.title.replace(' — Exzi','')+'</span>';
      b.addEventListener('click',function(){selectPoint(pt.key);});
      b.style.setProperty('--pc',pt.col||'#a78bfa');
      rail.appendChild(b);railBtns[pt.key]=b;
    });
    selectPoint('companion');
  }
  function tryPlay(){
    var v=byKey[current].videos[vidIdx];
    if(v.src){
      var el;
      if(/youtube|youtu\.be/.test(v.src)){
        el=document.createElement('iframe');
        el.src=v.src+(v.src.indexOf('?')>-1?'&':'?')+'autoplay=1';
        el.allow='autoplay; fullscreen';el.allowFullscreen=true;
      }else{
        el=document.createElement('video');
        el.src=v.src;el.controls=true;el.autoplay=true;el.playsInline=true;
      }
      var old=frame.querySelector('video,iframe');if(old){old.remove();}
      frame.appendChild(el);
    }else{
      pNote.classList.add('on');
      clearTimeout(noteTimer);
      noteTimer=setTimeout(function(){pNote.classList.remove('on');},2600);
    }
  }
  if(frame){
    frame.addEventListener('click',tryPlay);
    frame.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();tryPlay();}
    });
    document.getElementById('pPrev').addEventListener('click',function(){selectVideo(vidIdx-1);});
    document.getElementById('pNext').addEventListener('click',function(){selectVideo(vidIdx+1);});
  }

  /* reveal on scroll */
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){en.target.classList.add('on');io.unobserve(en.target);}
      });
    },{threshold:.14});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
  }else{
    document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('on');});
  }

  /* ===== intro: dissect the real logo into eight wedges, open, spread ===== */
  (function(){
    var intro=document.getElementById('intro');
    if(!intro) return;
    var reduced=false;
    try{ reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    var seen=false;
    try{ seen = sessionStorage.getItem('exz_intro') === '1'; }catch(e){}
    if(reduced || seen){ intro.classList.add('gone'); intro.remove(); return; }
    (function(){
      var cv=document.getElementById('introFx'); if(!cv) return;
      var x=cv.getContext('2d'),W,H,D,N=[],t0=performance.now();
      function sz(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
        cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';x.setTransform(D,0,0,D,0,0);}
      sz();addEventListener('resize',sz);
      for(var i=0;i<46;i++)N.push({x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14,r:.5+Math.random()*1.4,tw:Math.random()*6.3});
      (function loop(now){
        var t=(now-t0)/1000; if(t>4.4) return;
        x.clearRect(0,0,W,H);
        for(var i=0;i<N.length;i++){var n=N[i];n.x+=n.vx;n.y+=n.vy;
          if(n.x<0)n.x=W;if(n.x>W)n.x=0;if(n.y<0)n.y=H;if(n.y>H)n.y=0;
          var a=(.1+.22*Math.abs(Math.sin(t*.9+n.tw)))*Math.min(1,t/1.2)*(t>3?Math.max(0,1-(t-3)/1.4):1);
          x.fillStyle='rgba(196,181,253,'+a.toFixed(3)+')';
          x.beginPath();x.arc(n.x,n.y,n.r,0,6.283);x.fill();}
        requestAnimationFrame(loop);
      })(t0);
    })();
    var dismiss=function(){
      intro.classList.add('gone');
      try{ sessionStorage.setItem('exz_intro','1'); }catch(e){}
      setTimeout(function(){ if(intro.parentNode) intro.remove(); }, 800);
    };
    setTimeout(dismiss, 4200);              /* hard safety net */
    var host=document.getElementById('introWedges');
    var NSI='http://www.w3.org/2000/svg';
    var ORDER=[0,4,2,6,1,5,3,7];        /* opposite pairs open together — reads as unfolding */
    function pt(a,R){ return (R*Math.sin(a*Math.PI/180)).toFixed(1)+','+(-R*Math.cos(a*Math.PI/180)).toFixed(1); }
    for(var w=0; w<8; w++){
      var cp=document.createElementNS(NSI,'clipPath');
      cp.setAttribute('id','iwc'+w);
      var poly=document.createElementNS(NSI,'polygon');
      poly.setAttribute('points','0,0 '+pt(w*45-22.5,900)+' '+pt(w*45,900)+' '+pt(w*45+22.5,900));
      cp.appendChild(poly);
      host.appendChild(cp);
      var g=document.createElementNS(NSI,'g');
      g.setAttribute('class','iwedge');
      g.setAttribute('clip-path','url(#iwc'+w+')');
      g.style.setProperty('--wd',(0.55+ORDER.indexOf(w)*0.085)+'s');
      g.style.setProperty('--wr',((w%2?-1:1)*34)+'deg');
      var inner=document.createElementNS(NSI,'g');
      inner.setAttribute('transform','translate(-501.2,-332.5)');
      var scaler=document.createElementNS(NSI,'g');
      scaler.setAttribute('transform','translate(-0.585009,664.948823) scale(0.1,-0.1)');
      scaler.setAttribute('fill','url(#iLogoG)');
      var p=document.createElementNS(NSI,'path');
      p.setAttribute('d', LOGO_MAIN + ' ' + LOGO_INNER);
      p.setAttribute('fill-rule','evenodd');
      scaler.appendChild(p); inner.appendChild(scaler); g.appendChild(inner);
      host.appendChild(g);
    }
    var flash=document.createElement('div'); flash.className='flash'; intro.appendChild(flash);
    setTimeout(dismiss, 3150);
  })();
})();
</script>
